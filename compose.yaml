services:
  app:
    container_name: app
    build: .
    command: sh -c "alembic upgrade head && python -m migrations.seed && uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: always
    depends_on:
      - redis
      - db

  db:
    container_name: postgresql_db
    image: postgres:15
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easygem
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    build: .
    command: celery -A src.celery_app.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - app

  celery_beat:
    build: .
    command: celery -A src.celery_app.celery beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - app

  flower:
    build: .
    command: celery -A src.celery_app.celery flower --port=5555
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery

volumes:
  redis_data:
  db: